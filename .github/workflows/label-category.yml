# Labels registry PRs by category / transport / auth. TD-056: the previous inline github-script step failed on every PR
# (`require.resolve is not a function`); the logic now lives in scripts/ci/label-category.mjs.
# SECURITY: trigger is `pull_request` (never pull_request_target or workflow_run). Under pull_request the base-sha checkout
# is NOT a protection by itself; the boundary is the token scope: fork PRs get a read-only token and are never labelled
# (the job only warns), same-repo PRs come from people with write access. The labeller parses the PR's registry.yaml as
# data only (vendored js-yaml) and executes nothing from the PR checkout.
name: Auto-Label by Category

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
    paths:
      - 'registry.yaml'

permissions: {}

jobs:
  label-category:
    name: Label PR by MCP category
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      # TD-061: head is the PR merge commit (refs/pull/N/merge); depth 2 brings in its parents. The "before" registry is
      # the merge commit's FIRST parent (the base branch tip the merge was made on), not pull_request.base.sha, which
      # goes stale when main moves and would mislabel entries that changed on main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: head
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Detect additions and label
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          set -euo pipefail
          # must be a two-parent merge commit; fail loudly rather than label against the wrong base
          test "$(git -C head rev-list --parents -n1 HEAD | wc -w)" -eq 3
          git -C head show HEAD^1:registry.yaml > base-registry.yaml
          node base/scripts/ci/label-category.mjs head/registry.yaml --base base-registry.yaml
