# Labels registry PRs by category / transport / auth. TD-056: the previous inline github-script step failed on every PR
# (`require.resolve is not a function`); the logic now lives in scripts/ci/label-category.mjs.
# SECURITY: trigger is `pull_request` (never pull_request_target). The script and node_modules come from the BASE sha;
# the PR's registry.yaml is checked out to head/ and parsed as data only (js-yaml safe load). No PR code is executed.
name: Auto-Label by Category

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
    paths:
      - 'registry.yaml'

permissions: {}

jobs:
  label-category:
    name: Label PR by MCP category
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: head
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Install base dependencies (lockfile, no install scripts)
        run: cd base && npm ci --ignore-scripts --no-audit --no-fund

      - name: Detect additions and label
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node base/scripts/ci/label-category.mjs head/registry.yaml
