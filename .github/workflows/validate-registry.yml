# SECURITY: never switch this workflow (or any workflow in this repo) to `pull_request_target`.
# It would run untrusted PR content with a privileged token. Sync PRs from the official-registry
# sync are untrusted input like any other (ADR-024); a test (scripts/test/workflows.test.mjs) enforces it.
name: Validate Registry

on:
  # No `paths` filter: the diff-scope check must see every file a sync-branch PR touches,
  # and a required check that is skipped by a path filter never reports.
  pull_request:
    branches: [main]

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  validate-schema:
    name: Validate registry.yaml against schema
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Install validation dependencies (lockfile, no install scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate registry.yaml
        id: validate
        run: |
          node << 'EOF'
          const fs = require('fs');
          const yaml = require('js-yaml');
          const Ajv = require('ajv');
          const addFormats = require('ajv-formats');

          const ajv = new Ajv({ allErrors: true, strict: false });
          addFormats(ajv);

          const schema = JSON.parse(fs.readFileSync('schema/registry.schema.json', 'utf8'));
          const registry = yaml.load(fs.readFileSync('registry.yaml', 'utf8'));

          const validate = ajv.compile(schema);
          const valid = validate(registry);

          if (!valid) {
            console.error('Schema validation FAILED:');
            validate.errors.forEach(err => {
              console.error(`  ${err.instancePath || '(root)'}: ${err.message}`);
            });
            process.exit(1);
          }

          console.log(`Schema validation passed. Registry contains ${registry.mcps.length} entries.`);
          EOF

      - name: Check for duplicate names
        run: |
          node << 'EOF'
          const fs = require('fs');
          const yaml = require('js-yaml');
          const registry = yaml.load(fs.readFileSync('registry.yaml', 'utf8'));
          const names = registry.mcps.map(m => m.name);
          const dupes = names.filter((n, i) => names.indexOf(n) !== i);
          if (dupes.length > 0) {
            console.error('Duplicate entry names found:', dupes.join(', '));
            process.exit(1);
          }
          console.log('No duplicate names. All entry names are unique.');
          EOF

      - name: Security checks on new entries
        run: |
          node << 'EOF'
          const fs = require('fs');
          const yaml = require('js-yaml');
          const { execSync } = require('child_process');

          const registry = yaml.load(fs.readFileSync('registry.yaml', 'utf8'));
          const errors = [];
          const warnings = [];

          // Get changed entries by comparing with base (approximate)
          for (const mcp of registry.mcps) {
            // Check HTTP transport uses HTTPS
            if (mcp.transport_type === 'http' && mcp.config && mcp.config.url) {
              if (!mcp.config.url.startsWith('https://') && !mcp.config.url.startsWith('${')) {
                errors.push(`[${mcp.name}] config.url must use HTTPS: ${mcp.config.url}`);
              }
            }

            // Check stdio commands don't pipe to shell
            if (mcp.transport_type === 'stdio' && mcp.config && mcp.config.command) {
              const cmd = mcp.config.command.join(' ');
              if (cmd.includes('bash -c') || cmd.includes('sh -c') || cmd.includes('| sh') || cmd.includes('| bash')) {
                errors.push(`[${mcp.name}] Suspicious command pattern (piping to shell): ${cmd}`);
              }
              if (cmd.includes('curl') && (cmd.includes('| sh') || cmd.includes('| bash'))) {
                errors.push(`[${mcp.name}] Remote code execution pattern detected: ${cmd}`);
              }
            }

            // Check for private/localhost URLs
            if (mcp.config && mcp.config.url) {
              const url = mcp.config.url;
              if (url.includes('localhost') || url.includes('127.0.0.1') || url.includes('192.168.') || url.includes('10.0.') || url.includes('172.16.')) {
                errors.push(`[${mcp.name}] config.url points to private/local address: ${url}`);
              }
            }

            // Warn about missing documentation
            if (!mcp.repository_url && !mcp.documentation_url) {
              warnings.push(`[${mcp.name}] Missing repository_url and documentation_url`);
            }
          }

          if (warnings.length > 0) {
            console.warn('Warnings:');
            warnings.forEach(w => console.warn(' ', w));
          }

          if (errors.length > 0) {
            console.error('Security check FAILED:');
            errors.forEach(e => console.error(' ', e));
            process.exit(1);
          }

          console.log('Security checks passed.');
          EOF

      - name: OAuth config checks (TD-031)
        run: |
          node << 'EOF'
          const fs = require('fs');
          const yaml = require('js-yaml');
          const registry = yaml.load(fs.readFileSync('registry.yaml', 'utf8'));
          const errors = [];
          const CLIENT_ID = /^[A-Z][A-Z0-9_]*_CLIENT_ID$/;

          for (const mcp of registry.mcps) {
            const oc = mcp.oauth_config;
            if (!oc) continue;
            for (const key of ['auth_url', 'token_url', 'revocation_url']) {
              if (oc[key] !== undefined && !/^https:\/\//.test(String(oc[key]))) {
                errors.push(`[${mcp.name}] oauth_config.${key} must use https`);
              }
            }
            if (oc.client_id_env !== undefined && !CLIENT_ID.test(String(oc.client_id_env))) {
              errors.push(`[${mcp.name}] oauth_config.client_id_env must match ${CLIENT_ID} (ending in _CLIENT_ID)`);
            }
          }

          if (errors.length > 0) {
            console.error('OAuth config check FAILED:');
            errors.forEach(e => console.error(' ', e));
            process.exit(1);
          }
          console.log('OAuth config checks passed.');
          EOF

      - name: Registry policy checks (pins, text lint, verified, sync diff-scope)
        env:
          # passed via env, never interpolated into the script
          HEAD_REF: ${{ github.head_ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          SYNC_APP_LOGIN: ${{ vars.SYNC_APP_LOGIN }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          git show FETCH_HEAD:registry.yaml > "$RUNNER_TEMP/base-registry.yaml"
          git diff --name-only FETCH_HEAD HEAD > "$RUNNER_TEMP/changed-files.txt"
          node scripts/ci/check.mjs --base "$RUNNER_TEMP/base-registry.yaml" --head registry.yaml --changed-files "$RUNNER_TEMP/changed-files.txt"

      - name: Workflow and tooling tests
        run: npm test

      - name: Post validation summary comment
        if: always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const outcome = '${{ job.status }}';
            const icon = outcome === 'success' ? '✅' : '❌';

            const body = `## ${icon} Registry Validation ${outcome === 'success' ? 'Passed' : 'Failed'}

            ${outcome !== 'success' ? '**One or more validation checks failed.** See the workflow run for details.\n\nCommon issues:\n- Schema validation error: check required fields and field formats\n- Duplicate name: each entry must have a unique `name`\n- Security check: `http` transport must use HTTPS; `stdio` commands must not pipe to shell\n- OAuth check: `oauth_config` URLs must use https and `client_id_env` must end in `_CLIENT_ID`' : 'All checks passed:\n- ✅ JSON Schema validation\n- ✅ No duplicate entry names\n- ✅ Security pattern checks\n- ✅ OAuth config checks\n- ✅ Pin, text and sync-scope policy checks'}`;

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            const existing = comments.data.find(c => c.body.includes('Registry Validation'));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }
